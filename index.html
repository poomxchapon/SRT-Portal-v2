const KioskView = ({ shops, onAdmin }) => {
  const [lang, setLang] = useState('th');
  const [modal, setModal] = useState(null);
  const [selectedLoc, setSelectedLoc] = useState(null);
  const [response, setResponse] = useState('');
  const [speaking, setSpeaking] = useState(false);
  const [loading, setLoading] = useState(false);
  const [time, setTime] = useState(new Date());
  const [mapScale, setMapScale] = useState(1);
  const [muted, setMuted] = useState(false);
  const [search, setSearch] = useState('');
  const [question, setQuestion] = useState('');
  const [selectedBanner, setSelectedBanner] = useState(null);
  const bannerRef = useRef(null);
  const bannerIdx = useRef(0);

  // Auto-scroll banners
  useEffect(() => {
    const interval = setInterval(() => {
      if (!bannerRef.current) return;
      const container = bannerRef.current;
      const cardWidth = container.firstChild?.offsetWidth || 0;
      bannerIdx.current = (bannerIdx.current + 1) % BANNERS.length;
      container.scrollTo({ left: bannerIdx.current * (cardWidth + 12), behavior: 'smooth' });
    }, 4000);
    return () => clearInterval(interval);
  }, []);

  const t = T[lang];
  const locs = useMemo(() => !search ? LOCATIONS : LOCATIONS.filter(l => l.name[lang].toLowerCase().includes(search.toLowerCase())), [search,lang]);

  const trains = useMemo(() => BASE_TRAINS.map(tr => {
    const d = new Date(time.getTime() + tr.offset*60000);
    let st = 'onTime';
    if (tr.offset < 0) st = 'departed';
    else if (tr.offset < 10) st = 'boarding';
    else if (tr.offset > 60 && tr.offset < 70) st = 'delayed';
    return { ...tr, time: `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`, left: tr.offset, st };
  }), [time]);

  useEffect(() => { const i = setInterval(()=>setTime(new Date()),1000); return ()=>clearInterval(i); }, []);

  const audioRef = useRef(null);

  const tts = (text) => {
    if (muted) return;

    // Stop previous audio
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();

    const langMap = { th: 'th', en: 'en', cn: 'zh-CN', kr: 'ko' };
    const tl = langMap[lang] || 'en';

    // Strategy 1: Google Translate TTS (free, works everywhere, no API key)
    try {
      setSpeaking(true);
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${tl}&client=tw-ob&q=${encodeURIComponent(text)}`;
      const audio = new Audio(url);
      audioRef.current = audio;
      audio.onended = () => { setSpeaking(false); audioRef.current = null; };
      audio.onerror = () => {
        // Strategy 2: Web Speech API fallback
        audioRef.current = null;
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = { th:'th-TH', cn:'zh-CN', kr:'ko-KR', en:'en-US' }[lang] || 'en-US';
          u.onend = () => setSpeaking(false);
          u.onerror = () => setSpeaking(false);
          window.speechSynthesis.speak(u);
        } else {
          setSpeaking(false);
        }
      };
      audio.play().catch(() => {
        // play() rejected — try Web Speech API
        audioRef.current = null;
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = { th:'th-TH', cn:'zh-CN', kr:'ko-KR', en:'en-US' }[lang] || 'en-US';
          u.onend = () => setSpeaking(false);
          u.onerror = () => setSpeaking(false);
          window.speechSynthesis.speak(u);
        } else {
          setSpeaking(false);
        }
      });
    } catch (e) {
      setSpeaking(false);
    }
  };

      const l = text.toLowerCase();
      if(l.includes('ห้องน้ำ')||l.includes('toilet')||l.includes('wc')) reply=FAQS[0].a[lang];
      else if(l.includes('ตั๋ว')||l.includes('ticket')) reply=FAQS[1].a[lang];
      else if(l.includes('อาหาร')||l.includes('กิน')||l.includes('food')) reply=FAQS[2].a[lang];
      else if(l.includes('wifi')||l.includes('ไวไฟ')) reply=FAQS[3].a[lang];
      else if(l.includes('แท็กซี่')||l.includes('taxi')||l.includes('grab')) reply=FAQS[4].a[lang];
      else if(l.includes('หาย')||l.includes('lost')) reply=FAQS[5].a[lang];
      else if(l.includes('รถไฟ')||l.includes('train')) reply=lang==='th'?'รถไฟขบวนถัดไปจะออกในอีก 15 นาทีครับ ชานชาลาที่ 1':'Next train departs in 15 minutes, Platform 1.';
      else if(l.includes('สวัสดี')||l.includes('hello')||l.includes('hi')) reply=T[lang].greeting;
      setResponse(reply); tts(reply);
    }, 600);
  };

            {/* Flow details table */}
            <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden">
              <div className="p-5 border-b border-gray-50"><h3 className="font-bold text-gray-800">Device Flow Details — Node → Node</h3></div>
              <table className="w-full text-sm">
                <thead className="bg-gray-50 text-gray-500 text-xs uppercase">
                  <tr><th className="px-5 py-3 text-left">From</th><th className="px-5 py-3 text-center">→</th><th className="px-5 py-3 text-left">To</th><th className="px-5 py-3 text-right">Devices</th><th className="px-5 py-3 text-right">% of Total</th></tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {[...FLOWS].sort((a,b)=>b.count-a.count).map((f, i) => {
                    const from = nodeById(f.from), to = nodeById(f.to);
                    const total = FLOWS.reduce((s,fl)=>s+fl.count,0);
                    return (
                      <tr key={i} className="hover:bg-gray-50/50 cursor-default">
                        <td className="px-5 py-3">
                          <div className="flex items-center gap-2">
                            <div className="w-6 h-6 rounded-full bg-indigo-100 flex items-center justify-center text-[9px] font-bold text-indigo-700">{f.from.replace('N','')}</div>
                            <span className="font-medium text-gray-800">{from?.name}</span>
                          </div>
                        </td>
                        <td className="px-5 py-3 text-center"><ArrowRight size={14} className="text-gray-300 mx-auto"/></td>
                        <td className="px-5 py-3">
                          <div className="flex items-center gap-2">
                            <div className="w-6 h-6 rounded-full bg-cyan-100 flex items-center justify-center text-[9px] font-bold text-cyan-700">{f.to.replace('N','')}</div>
                            <span className="font-medium text-gray-800">{to?.name}</span>
                          </div>
                        </td>
                        <td className="px-5 py-3 text-right font-inter font-bold text-gray-800">{f.count.toLocaleString()}</td>
                        <td className="px-5 py-3 text-right">
                          <div className="flex items-center justify-end gap-2">
                            <div className="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${(f.count/total*100).toFixed(0)}%`, backgroundColor:f.color}}/></div>
                            <span className="text-xs font-inter text-gray-500">{(f.count/total*100).toFixed(1)}%</span>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

      </div>
    </div>
  );
};

// ═══════════════════════════════════════════
// 7. MAIN APP
// ═══════════════════════════════════════════
function App() {
  const [view, setView] = useState('kiosk');
  const [logged, setLogged] = useState(false);
  const [shops, setShops] = useState([]);
  const [zones, setZones] = useState([]);
  const [users, setUsers] = useState([]);
  const [offline, setOffline] = useState(false);
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loginErr, setLoginErr] = useState('');

  useEffect(() => {
    const load = async () => {
      const s = await api.get('shops');
      if (s?.length) { setShops(s); setOffline(false); } else { if(!shops.length) setShops(FALLBACK_SHOPS); setOffline(true); }
      const z = await api.get('live_stats');
      if (z?.length) setZones(z); else if(!zones.length) setZones(FALLBACK_ZONES);
      const u = await api.get('staff');
      if (u?.length) setUsers(u); else if(!users.length) setUsers(FALLBACK_USERS);
    };
    load();
    const i = setInterval(load, 5000);
    return () => clearInterval(i);
  }, []);

  const login = (e) => {
    e.preventDefault();
    if (username==='admin'&&password==='1234') { setLogged(true); setView('admin'); return; }
    const f = users.find(u=>(u.email===username||u.email===username+'@srt.or.th')&&u.password===password);
    if (f) { setLogged(true); setView('admin'); }
    else setLoginErr('Invalid username or password');
  };

  const logout = () => { setLogged(false); setView('kiosk'); setUsername(''); setPassword(''); setLoginErr(''); };

  if (view === 'kiosk') return <KioskView shops={shops} onAdmin={()=>setView('login')}/>;

  if (view === 'login') return (
    <div className="h-full flex items-center justify-center bg-kiosk-bg font-prompt relative overflow-hidden">
      <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{backgroundImage:'radial-gradient(circle,#06b6d4 1px,transparent 1px)',backgroundSize:'32px 32px'}}/>
      <div className="glass glow-border p-8 rounded-3xl w-full max-w-sm relative z-10 animate-fade-in">
        <div className="text-center mb-8">
          <div className="w-16 h-16 bg-kiosk-accent/20 rounded-2xl flex items-center justify-center mx-auto mb-4"><Lock size={28} className="text-kiosk-accent"/></div>
          <h2 className="text-2xl font-bold text-white">Admin Portal</h2>
          <p className="text-xs text-gray-500 mt-1">SRT Management System</p>
        </div>
        <form onSubmit={login} className="space-y-5">
          <div><label className="text-xs text-gray-500 font-bold uppercase">Username</label><input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full bg-gray-900/50 border border-kiosk-border rounded-xl py-3 px-4 text-white mt-1 focus:outline-none focus:border-kiosk-accent/50 transition-colors" placeholder="admin"/></div>
          <div><label className="text-xs text-gray-500 font-bold uppercase">Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-gray-900/50 border border-kiosk-border rounded-xl py-3 px-4 text-white mt-1 focus:outline-none focus:border-kiosk-accent/50 transition-colors" placeholder="1234"/></div>
          {loginErr && <div className="text-red-400 text-xs bg-red-950/30 border border-red-800/30 p-2.5 rounded-lg">{loginErr}</div>}
          <button type="submit" className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-3 rounded-xl btn-press cursor-pointer shadow-lg shadow-cyan-500/15 transition-all hover:shadow-cyan-500/25">Login</button>
        </form>
        <div className="mt-5 text-center"><button onClick={()=>setView('kiosk')} className="text-gray-500 hover:text-white text-xs underline cursor-pointer transition-colors">Back to Kiosk</button></div>
      </div>
    </div>
  );

  if (view === 'admin' && logged) return <AdminView onLogout={logout}/>;

  return null;
}

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
